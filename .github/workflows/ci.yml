name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies (no model or PostgreSQL service)
        run: python -m pip install -r requirements-ci.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m pyflakes *.py monitoring tests
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' haw | while IFS= read -r -d '' script; do
            bash -n "$script"
          done
